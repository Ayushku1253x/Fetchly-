<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fetchly">
<meta name="theme-color" content="#040c10">
<title>Fetchly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040c10;--bg2:#08181d;--ink:#e9f7f4;--mut:#7fa09c;--line:rgba(120,255,225,.12);--g1:#1de9a6;--g2:#1e9bf0;--card:rgba(14,38,42,.55);--fh:"Space Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h1,h2,h3,.fh{font-family:var(--fh);font-weight:500;letter-spacing:-.02em;margin:0}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;padding:24px 26px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .9s cubic-bezier(.77,0,.18,1)}
#loader.out{transform:translateY(-100%)}
#loader .nm{font:500 18px var(--fh);color:var(--mut)}
#cnt{font:500 clamp(70px,22vw,200px)/1 var(--fh);letter-spacing:-.05em}
#loader .ln{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--g1),var(--g2))}

/* ---------- skip ---------- */
#skip{position:fixed;z-index:60;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border:1px solid var(--line);border-radius:999px;padding:11px 20px;font:600 15px var(--fh);color:var(--ink);background:rgba(10,30,34,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);cursor:pointer}
#skip:active{transform:scale(.96)}
#spb{position:fixed;z-index:60;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--g1),var(--g2))}

/* ---------- intro (Fetchly ka apna scroll animation) ---------- */
#intro{height:1300vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0b2d31 0%,#05151a 48%,#030a0e 100%)}
.stage:before{content:"";position:absolute;inset:-20%;background:radial-gradient(38% 30% at var(--gx,50%) var(--gy,55%),rgba(29,233,166,.2),transparent 70%);pointer-events:none}
#cv{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform:scale(var(--k,1));transform-origin:50% 50%}
.stage.pt #cv{width:720px;height:1280px;margin:-640px 0 0 -360px}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;pointer-events:none;will-change:transform,opacity}
.sc h2{font-size:56px;line-height:1.06}
.sc p{color:var(--mut);font-size:20px;line-height:1.5;margin:16px 0 0;max-width:620px}
.pt .sc h2{font-size:58px}.pt .sc p{font-size:24px}
/* browser */
.brow{position:absolute;left:50%;top:50%;width:1020px;height:600px;margin:-300px 0 0 -510px;border-radius:18px;background:linear-gradient(180deg,#071a1e,#041014);border:1px solid var(--line);overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.55);will-change:transform,opacity}
.pt .brow{width:660px;height:900px;margin:-450px 0 0 -330px}
.bb{height:38px;background:#0a1d21;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.bb i{width:11px;height:11px;border-radius:50%;background:#2a4448}.bb i:nth-child(1){background:#ff6058}.bb i:nth-child(2){background:#ffbd2e}.bb i:nth-child(3){background:#28c93f}
.bb u{flex:1;max-width:340px;margin:0 auto;text-decoration:none;text-align:center;font-size:12px;color:var(--mut);background:rgba(255,255,255,.05);border-radius:8px;padding:5px 0}
.nv{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;font-size:13px;color:var(--mut)}
.nv b{font:500 18px var(--fh);color:var(--ink);display:flex;align-items:center;gap:8px}.nv b svg{width:20px;height:20px}
.nv span{display:flex;gap:24px;align-items:center}.nv em{font-style:normal;color:#03130f;background:var(--g1);padding:6px 14px;border-radius:99px;font-weight:600}
.pt .nv span a{display:none}
.bh{text-align:center;padding-top:18px}
.bh h1{font-size:54px;line-height:1.05}.pt .bh h1{font-size:50px}
.bh p{color:var(--mut);font-size:15px;max-width:480px;margin:14px auto 0;line-height:1.5}
.bh .bt{display:flex;gap:10px;justify-content:center;margin-top:18px}
.bh .bt i{font:600 13px var(--fh);font-style:normal;border-radius:10px;padding:10px 18px;border:1px solid var(--line)}
.bh .bt i:first-child{background:linear-gradient(90deg,var(--g1),var(--g2));color:#03130f;border:0}
/* device + hands */
.dev{position:absolute;left:50%;top:50%;width:760px;height:360px;margin:-180px 0 0 -380px;will-change:transform,opacity}

.ph{position:absolute;inset:40px 90px;border-radius:44px;background:#02080a;border:4px solid #20413f;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 90px rgba(29,233,166,.14);z-index:2}
.pscr{position:relative;height:100%;border-radius:34px;overflow:hidden;background:#06161b;display:flex;gap:10px;padding:10px}
.pv{flex:1;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(60% 70% at 30% 60%,rgba(255,90,70,.55),transparent 65%),linear-gradient(135deg,#0c5a60 0%,#0a3b44 45%,#0b1c30 100%)}
.pv:after{content:"";position:absolute;left:46%;top:38%;border-left:34px solid rgba(255,255,255,.85);border-top:22px solid transparent;border-bottom:22px solid transparent}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;font:500 11px var(--fh);color:#bff;letter-spacing:.04em;opacity:.9}
.ov{position:absolute;left:12px;bottom:12px;right:50px;background:rgba(5,20,24,.82);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11px;text-align:left;color:var(--ink);z-index:3}
.ov small{display:block;color:var(--mut);margin-top:2px;font-size:9.5px}.ov .pr{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}.ov .pr b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2))}
.side{width:88px;display:flex;flex-direction:column;gap:8px}
.side div{flex:1;border-radius:12px;background:linear-gradient(135deg,#0d4a50,#0a2230);border:1px solid var(--line);font:600 12px var(--fh);display:flex;align-items:flex-end;padding:7px;color:#cfe}
.side div:first-child{background:linear-gradient(135deg,#1de9a6,#0b6a74);color:#03130f}
.rec{position:absolute;right:16px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:#ff3b4e;border:3px solid #fff;z-index:3}
#s2t{position:absolute;left:90px;top:60px;width:400px;text-align:left;opacity:0;visibility:hidden}
.pt #s2t{left:50px;top:90px;width:620px}
#s2t h3{font-size:36px;line-height:1.1}.pt #s2t h3{font-size:46px}
#s2f{position:absolute;left:790px;top:140px;width:400px;text-align:left;opacity:0;visibility:hidden;display:flex;flex-direction:column;gap:14px}
.pt #s2f{left:50px;top:330px;width:620px}
.cf{border-left:3px solid var(--g1);padding:4px 0 4px 16px;will-change:transform,opacity}.cf b{display:block;font:500 26px var(--fh)}.cf small{display:block;color:var(--mut);font-size:15px;margin-top:4px}.pt .cf b{font-size:32px}.pt .cf small{font-size:20px}
#s2c{position:absolute;right:90px;bottom:90px;width:300px;text-align:left;opacity:0;visibility:hidden}
.pt #s2c{right:auto;left:50px;bottom:110px;width:560px}
#s2c b{display:flex;align-items:center;gap:8px;font:500 22px var(--fh)}#s2c b svg{width:22px;height:22px}
#s2c small{display:block;color:var(--mut);font-size:15px;line-height:1.5;margin-top:6px}.pt #s2c small{font-size:20px}
/* cards */
.pcs{display:flex;gap:24px;align-items:stretch}.pt .pcs{flex-direction:column}
.pc{width:480px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,62,64,.7),rgba(6,22,28,.92));padding:30px;text-align:left}
.pt .pc{width:620px;padding:34px}
.pc svg.hx{width:34px;height:34px;margin-bottom:14px}.pc h3{font-size:38px;line-height:1.08}.pc p{margin:10px 0 18px;font-size:17px;color:var(--mut);line-height:1.5}
.pt .pc h3{font-size:42px}.pt .pc p{font-size:20px}
.cvis{border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:16px}
.cvis .chips2{display:flex;gap:8px;flex-wrap:wrap}.cvis .chips2 i{font:500 14px var(--fh);font-style:normal;padding:8px 14px;border-radius:99px;border:1px solid var(--line)}.cvis .chips2 i.a{background:var(--g1);color:#03130f;border-color:var(--g1)}
.cvis .big{margin-top:14px;border-radius:12px;padding:13px;text-align:center;font:600 15px var(--fh);color:#03130f;background:linear-gradient(90deg,var(--g1),var(--g2))}
.cvis .fl{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}.cvis .fl:last-child{border:0}.cvis .fl span{color:var(--g1)}
/* features */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:1100px;margin-top:34px}
.pt .fgrid{grid-template-columns:repeat(2,1fr);width:640px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left}
.fc .im{aspect-ratio:1.25;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.fc b{display:block;font:500 17px var(--fh)}.fc span{display:block;color:var(--mut);font-size:13.5px;line-height:1.45;margin-top:5px}
.pt .fc b{font-size:21px}.pt .fc span{font-size:16px}
.fc svg{width:38%;height:auto}
/* star + faq */
.star{width:100px;height:100px;margin-bottom:12px}
.faq{width:600px;margin-top:28px;display:flex;flex-direction:column;gap:10px;text-align:left}.pt .faq{width:640px}
.fq{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px 20px;overflow:hidden}
.fq b{display:flex;justify-content:space-between;font:500 17px var(--fh)}.pt .fq b{font-size:21px}
.fq b:after{content:"+";color:var(--mut)}.fq.on b:after{content:"–"}
.fq div{max-height:0;overflow:hidden;color:var(--mut);font-size:15px;line-height:1.55;transition:max-height .5s ease,margin .5s ease}.pt .fq div{font-size:18px}
.fq.on div{max-height:140px;margin-top:10px}
/* icons */
#icons{position:relative;width:200px;height:200px}
#icons svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:transform,opacity,filter}
#icap{margin-top:26px;font:500 44px var(--fh)}
/* every link */
.big4{width:560px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,62,64,.7),rgba(6,22,28,.92));padding:34px;text-align:left}
.pt .big4{width:620px}
.big4 h3{font-size:42px;line-height:1.1;color:#4d6f6c}.big4 h3 b{color:var(--ink);font-weight:500}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.g4 div{border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:16px;font:500 17px var(--fh);color:#6d908c}
.g4 div svg{width:24px;height:24px;display:block;margin-bottom:12px}
/* try now */
#tryw{position:relative;display:inline-block}
.try{display:flex;align-items:center;gap:20px;border-radius:34px;padding:42px 84px;font:500 88px var(--fh);color:#fff;background:linear-gradient(100deg,#22e08a,#17c5b0 50%,#2185e8);box-shadow:0 30px 90px rgba(29,233,166,.28);will-change:transform}
.pt .try{font-size:84px;padding:38px 70px}
.try svg{width:.8em;height:.8em}.try{white-space:nowrap}
#rip{position:absolute;left:calc(64% + 11px);top:calc(52% + 6px);width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid rgba(255,255,255,.85);opacity:0;pointer-events:none}
#cur{position:absolute;left:64%;top:52%;width:64px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));will-change:transform}
/* tiles */
#tiles{position:absolute;left:50%;top:50%;display:grid;gap:24px;will-change:transform;transform-origin:50% 50%}
.tile{position:relative;width:420px;height:250px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(18,60,62,.7),rgba(6,22,28,.92));overflow:hidden;display:flex;align-items:center;justify-content:center;font:500 30px/1.1 var(--fh);text-align:center;padding:20px}
.tile>.cl{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.tile small{display:block;font:400 14px/1.4 -apple-system,sans-serif;color:var(--mut);margin-top:8px}
#enterw{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;text-align:center;z-index:5}
#enter{border:0;border-radius:18px;padding:18px 40px;font:600 20px var(--fh);color:#03130f;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 20px 60px rgba(29,233,166,.3);cursor:pointer}
#hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase;z-index:5;pointer-events:none}

.brow.lk{width:1020px;height:600px;margin:0}
.tile .try{box-shadow:none}

/* ---------- app ---------- */
#app{display:none;min-height:100vh;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 50px;max-width:980px;margin:0 auto}
body.in #app{display:block}
body.in #intro,body.in #skip,body.in #spb{display:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:10px;font:500 22px var(--fh)}
.logo svg{width:28px;height:28px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.hero h1{font-size:clamp(36px,8.5vw,72px);line-height:1.04}
.hero p{color:var(--mut);line-height:1.55;margin:14px 0 0;max-width:560px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:26px 0 18px;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:500 15px var(--fh);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#03130f;border-color:transparent}
.card{background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
input,select{flex:1 1 180px;min-width:0;font:16px -apple-system,sans-serif;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none}
input:focus,select:focus{border-color:var(--g1)}
select option{background:#08181d}
button.p{font:600 16px var(--fh);border:0;border-radius:14px;padding:14px 24px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#03130f;cursor:pointer}
button.g{font:500 15px var(--fh);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px 18px;cursor:pointer}
button:active{transform:scale(.97)}
.res{display:none}
.res img{width:100%;border-radius:16px;margin-bottom:12px}
.res h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px}
.chips a.def{background:linear-gradient(90deg,var(--g1),var(--g2));color:#03130f;border-color:transparent}
.msg{color:var(--mut);font-size:14px;line-height:1.5}
.hist button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;color:var(--ink);font:15px -apple-system,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.sec h2{font-size:clamp(24px,5vw,34px)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.vc .th{position:relative;aspect-ratio:16/9;background:#0b2226 center/cover no-repeat;cursor:pointer}
.vc .th:after{content:"";position:absolute;left:50%;top:50%;margin:-18px 0 0 -13px;border-left:28px solid rgba(255,255,255,.92);border-top:18px solid transparent;border-bottom:18px solid transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.vc .in{padding:12px}
.vc .tt{font:500 14.5px/1.3 var(--fh);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.vc .ch{color:var(--mut);font-size:12.5px;margin:6px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .ac{display:flex;gap:8px}
.vc .ac button{flex:1;font:600 13.5px var(--fh);border-radius:12px;padding:10px 0;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.vc .ac button.d{background:linear-gradient(90deg,var(--g1),var(--g2));color:#03130f;border:0}
.sk{aspect-ratio:16/10;border-radius:18px;background:linear-gradient(100deg,#0b2226 30%,#12363b 50%,#0b2226 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#modal{position:fixed;inset:0;z-index:90;background:rgba(2,8,10,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#mbox{width:min(100%,860px)}
#mbox .fr{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
#mbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#mt{font:500 18px var(--fh);margin:14px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:120;background:#0e2a2e;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:14px;max-width:90vw;text-align:center;transition:.35s}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:40px;line-height:1.8}
/* ---------- responsive: phone / iPad / PC ---------- */
@media (min-width:700px){
 #app{max-width:1100px;padding:calc(26px + env(safe-area-inset-top,0px)) 36px 70px}
 .top{margin-bottom:44px}.logo{font-size:26px}
 .card{padding:24px;border-radius:26px}
 .tg{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
 .tabs{overflow:visible;flex-wrap:wrap}
 #dl .card,#set .card{max-width:780px}
}
@media (min-width:1100px){
 #app{max-width:1280px;padding:34px 56px 90px}
 .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
 .hero p{margin:0;font-size:18px;max-width:420px}
 .tg{grid-template-columns:repeat(4,1fr)}
 #skip{top:22px;right:28px;padding:12px 24px}
}
@media (max-width:380px){.tabs button{padding:9px 14px;font-size:14px}.btns{flex-direction:column}}
@media (hover:hover){.vc{transition:transform .25s,border-color .25s}.vc:hover{transform:translateY(-4px);border-color:rgba(29,233,166,.4)}button.p:hover,.b1:hover{filter:brightness(1.1)}}
@media (prefers-reduced-motion:reduce){.rv{transition:none}}
.lg{border-radius:22%}
#s8t .sc{pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1de9a6"/><stop offset="1" stop-color="#1e9bf0"/></linearGradient></defs><symbol id="flogo" viewBox="0 0 108 108"><defs><linearGradient id="lgb" gradientUnits="userSpaceOnUse" x1="21" y1="17" x2="77" y2="78"><stop offse
