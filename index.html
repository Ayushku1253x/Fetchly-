<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fetchly">
<title>Fetchly</title>
<style>
:root{--bg:#f2f3ee;--ink:#14161a;--glass:rgba(255,255,255,.62);--line:rgba(20,22,26,.12);--acc:#ff5a1f;--mut:#5c6068;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--ink:#f2f3ee;--glass:rgba(40,44,52,.6);--line:rgba(255,255,255,.14);--mut:#a3a8b0}}
:root[data-theme="dark"]{--bg:#14161a;--ink:#f2f3ee;--glass:rgba(40,44,52,.6);--line:rgba(255,255,255,.14);--mut:#a3a8b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#intro{height:700vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#b9c08f;display:flex;align-items:center;justify-content:center;color:#14161a}
.marq{position:absolute;left:0;top:50%;white-space:nowrap;font-weight:900;font-size:clamp(110px,26vw,360px);letter-spacing:-.04em;line-height:1;will-change:transform;opacity:.9}
.wave{position:absolute;inset:10% 0;display:flex;align-items:center;gap:6px;padding:0 12px}
.wave i{flex:1;background:#14161a;border-radius:3px;min-width:3px;height:4%}
.tape{position:relative;width:min(78vw,440px);aspect-ratio:1.6;border-radius:20px;border:3px solid #14161a;background:linear-gradient(160deg,#e6ead2,#c8cfa6);box-shadow:0 30px 60px rgba(0,0,0,.3);will-change:transform}
.lab{position:absolute;left:8%;right:8%;top:9%;height:30%;background:#fff;border:2px solid #14161a;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;font-weight:900;letter-spacing:.04em;font-size:clamp(13px,3.4vw,22px)}
.lab span{color:#ff5a1f}
.win{position:absolute;left:14%;right:14%;bottom:12%;height:38%;background:#14161a;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6%}
.reel{width:30%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#14161a 0 22deg,#e6ead2 22deg 60deg);border:3px solid #e6ead2;will-change:transform}
.blob{position:absolute;width:min(56vw,300px);aspect-ratio:1;opacity:0;background:radial-gradient(circle at 30% 25%,#fff 0,#9fb6ff 22%,#8a5cff 60%,#3a1fb0 100%);border-radius:42% 58% 55% 45%/48% 42% 58% 52%;box-shadow:inset -14px -18px 40px rgba(0,0,0,.28),inset 12px 14px 30px rgba(255,255,255,.6),0 30px 70px rgba(60,30,160,.35);animation:morph 7s ease-in-out infinite}
@keyframes morph{50%{border-radius:58% 42% 40% 60%/55% 58% 42% 45%}}
.cap{position:absolute;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom,0px));text-align:center;font-weight:800;font-size:clamp(24px,5vw,46px);letter-spacing:-.02em;padding:0 20px}
.cap small{display:block;font-weight:500;font-size:clamp(13px,2vw,18px);opacity:.7;margin-top:8px;letter-spacing:0}
.bar{position:absolute;left:0;right:0;bottom:calc(4% + env(safe-area-inset-bottom,0px));padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.prog{width:min(420px,80%);height:3px;background:rgba(0,0,0,.2);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;width:0;background:#ff5a1f}
#skip{position:fixed;z-index:10;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border:0;border-radius:999px;padding:11px 20px;font:600 15px -apple-system,sans-serif;color:#14161a;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px rgba(0,0,0,.1);cursor:pointer}
#enter{pointer-events:none;opacity:0;border:0;border-radius:999px;padding:14px 30px;font:700 17px -apple-system,sans-serif;background:#14161a;color:#fff;cursor:pointer;transition:opacity .3s}
#app{min-height:100vh;padding:24px 18px 40px;max-width:760px;margin:0 auto}
h1{font-size:clamp(34px,7vw,52px);letter-spacing:-.03em;margin:6px 0 4px}
p.sub{color:var(--mut);margin:0 0 18px;line-height:1.5}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:600 15px -apple-system,sans-serif;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
input,select{flex:1 1 180px;min-width:0;font:16px -apple-system,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:16px;padding:14px 16px;outline:none}
button.p{font:600 16px -apple-system,sans-serif;border:0;border-radius:16px;padding:14px 22px;background:var(--acc);color:#fff;cursor:pointer}
button.g{font:600 15px -apple-system,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer}
.res{display:none}
.res img{width:100%;border-radius:18px;margin-bottom:12px}
.res h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px}
.chips a.def{background:var(--acc);color:#fff;border-color:var(--acc)}
.msg{color:var(--mut);font-size:14px;line-height:1.5}
.hist button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;color:var(--ink);font:15px -apple-system,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:30px;line-height:1.8}
</style>
</head>
<body>
<button id="skip" type="button">Skip ›</button>
<section id="intro">
 <div class="stage" id="stage">
  <div class="wave" id="wave"></div>
  <div class="marq" id="marq">FETCH • SAVE • WATCH • FETCH • SAVE • WATCH • FETCH •</div>
  <div class="tape" id="tape"><div class="lab">FETCHLY<span>SIDE A</span></div><div class="win"><div class="reel" id="r1"></div><div class="reel" id="r2"></div></div></div>
  <div class="blob" id="blob"></div>
  <div class="cap" id="cap">Namaste<small>Scroll karo ↓</small></div>
  <div class="bar"><div class="prog"><b id="pb"></b></div><button id="enter" type="button">Open Fetchly</button></div>
 </div>
</section>
<main id="app">
 <h1>Fetchly</h1>
 <p class="sub">Link paste karo, quality chuno, download karo.</p>
 <div class="tabs" id="tabs"><button class="on" data-t="yt">YouTube</button><button data-t="ig">Instagram</button><button data-t="web">Websites</button><button data-t="set">Settings</button></div>
 <div id="dl">
  <div class="card">
   <div class="row"><input id="url" type="url" inputmode="url" placeholder="YouTube link paste karo" autocapitalize="off" autocorrect="off"><button class="p" id="go" type="button">Fetch</button></div>
   <div class="row"><button class="g" id="paste" type="button">Paste from clipboard</button></div>
   <div class="msg" id="msg"></div>
  </div>
  <div class="card res" id="res"><img id="th" alt=""><h3 id="ti"></h3><div class="chips" id="ch"></div></div>
  <div class="card hist"><b>Recent</b><div id="hist"></div></div>
 </div>
 <div id="set" style="display:none">
  <div class="card">
   <label>Server address</label>
   <div class="row"><input id="api" type="url" placeholder="https://your-server.onrender.com"></div>
   <p class="msg">iOS par yt-dlp seedha nahi chalta, isliye ek server chahiye jo download karta hai.</p>
   <label>Default quality</label>
   <div class="row"><select id="dq"><option value="best">Best</option><option value="h2160">2160p</option><option value="h1080">1080p</option><option value="h720">720p</option><option value="h480">480p</option><option value="audio">Audio MP3</option></select></div>
   <label>Theme</label>
   <div class="row"><select id="th2"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
   <div class="row"><button class="p" id="save" type="button">Save settings</button><button class="g" id="clr" type="button">Clear history</button><button class="g" id="rep" type="button">Replay intro</button></div>
   <div class="msg" id="smsg"></div>
  </div>
 </div>
 <footer>Made in India with ♥<br>Designed by Ayush</footer>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var intro=$('intro'),marq=$('marq'),blob=$('blob'),tape=$('tape'),cap=$('cap'),pb=$('pb'),stage=$('stage'),wave=$('wave'),enter=$('enter');
var N=48,bars=[];
for(var i=0;i<N;i++){var b=document.createElement('i');wave.appendChild(b);bars.push(b)}
var words=[[0,'Namaste','Scroll karo ↓'],[.2,'Link paste karo','YouTube, Instagram, koi bhi site'],[.45,'Quality chuno','720p se 4K tak'],[.68,'Save karo','Seedha iPad mein'],[.88,'Fetchly','Made in India with ♥']];
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function cl(x){return Math.max(0,Math.min(1,x))}
var tick=false;
function draw(){
 tick=false;
 var p=cl((window.scrollY-intro.offsetTop)/(intro.offsetHeight-window.innerHeight));
 pb.style.width=(p*100)+'%';
 marq.style.transform='translate('+(-p*72)+'%,-50%)';
 var wv=cl((p-.2)/.25)*(1-cl((p-.72)/.15));
 wave.style.opacity=wv;
 for(var i=0;i<N;i++){bars[i].style.height=((6+Math.abs(Math.sin(i*.55+p*14))*Math.sin(i/N*Math.PI)*88)*cl(wv*1.4))+'%'}
 var o=cl((p-.45)/.2);
 stage.style.background='rgb('+mix(185,255,o)+','+mix(192,90,o)+','+mix(143,31,o)+')';
 var e=cl(p/.2),big=cl((p-.25)/.3),sh=cl((p-.72)/.18);
 var s=(1+big*.3)*(1-sh*.75);
 tape.style.transform='translateY('+(-55*(1-e))+'vh) rotate('+(-28*(1-e)+sh*40)+'deg) scale('+s+')';
 tape.style.opacity=1-cl((p-.8)/.12);
 $('r1').style.transform=$('r2').style.transform='rotate('+(p*1440)+'deg)';
 blob.style.opacity=cl((p-.82)/.12);
 blob.style.transform='scale('+(.6+cl((p-.82)/.18)*.4)+')';
 var w=words[0];for(var k=0;k<words.length;k++){if(p>=words[k][0])w=words[k]}
 if(cap.firstChild.textContent!==w[1]){cap.innerHTML=w[1]+'<small>'+w[2]+'</small>'}
 var d=p>.95;enter.style.opacity=d?1:0;enter.style.pointerEvents=d?'auto':'none';
}
function req(){if(!tick){tick=true;requestAnimationFrame(draw)}}
window.addEventListener('scroll',req,{passive:true});window.addEventListener('resize',req);draw();
function toApp(){$('app').scrollIntoView({behavior:'smooth'})}
$('skip').onclick=toApp;enter.onclick=toApp;
$('rep').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
var api=ls('f_api')||'',dq=ls('f_dq')||'best',theme=ls('f_th')||'auto',hist=[];
try{hist=JSON.parse(ls('f_hist')||'[]')}catch(e){}
$('api').value=api;$('dq').value=dq;$('th2').value=theme;
function applyTheme(){var r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme)}
applyTheme();
var hints={yt:'YouTube link paste karo',ig:'Instagram reel ya post ka link',web:'Kisi bhi website ka video link'};
var tabs=$('tabs').children;
for(var t=0;t<tabs.length;t++)tabs[t].onclick=function(){
 for(var j=0;j<tabs.length;j++)tabs[j].className='';this.className='on';
 var k=this.getAttribute('data-t'),st=k==='set';
 $('dl').style.display=st?'none':'block';$('set').style.display=st?'block':'none';
 if(!st)$('url').placeholder=hints[k];
};
function showHist(){var h=$('hist');h.innerHTML='';if(!hist.length){h.innerHTML='<p class="msg">Abhi kuch nahi.</p>';return}
 hist.forEach(function(x){var b=document.createElement('button');b.textContent=x.t;b.onclick=function(){$('url').value=x.u;fetchInfo()};h.appendChild(b)})}
showHist();
$('save').onclick=function(){api=$('api').value.trim().replace(/\/+$/,'');dq=$('dq').value;theme=$('th2').value;ls('f_api',api);ls('f_dq',dq);ls('f_th',theme);applyTheme();$('smsg').textContent='Saved.'};
$('clr').onclick=function(){hist=[];ls('f_hist','[]');showHist();$('smsg').textContent='History clear.'};
$('paste').onclick=function(){if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(x){$('url').value=x}).catch(function(){$('msg').textContent='Clipboard allow karo ya link khud paste karo.'})}else{$('msg').textContent='Link khud paste karo.'}};
function fetchInfo(){
 var u=$('url').value.trim(),m=$('msg');
 if(!u){m.textContent='Pehle link paste karo.';return}
 if(!api){m.textContent='Settings mein server address daalo, tabhi download chalega.';return}
 m.textContent='Fetching…';$('res').style.display='none';
 fetch(api+'/info?url='+encodeURIComponent(u)).then(function(r){return r.json()}).then(function(d){
  if(d.error){m.textContent='Error: '+d.error;return}
  m.textContent='';var ti=d.title||'Video';$('ti').textContent=ti;
  var t=$('th');if(d.thumbnail){t.src=d.thumbnail;t.style.display='block'}else{t.style.display='none'}
  var c=$('ch');c.innerHTML='';
  (d.formats||[]).forEach(function(f){var a=document.createElement('a');a.textContent=f.label;if(f.id===dq)a.className='def';a.href=api+'/download?url='+encodeURIComponent(u)+'&f='+encodeURIComponent(f.id);c.appendChild(a)});
  $('res').style.display='block';
  hist=hist.filter(function(x){return x.u!==u});hist.unshift({u:u,t:ti});hist=hist.slice(0,10);ls('f_hist',JSON.stringify(hist));showHist();
 }).catch(function(){m.textContent='Server se jawab nahi mila. Address check karo.'});
}
$('go').onclick=fetchInfo;
})();
</script>
</body>
  </html>
